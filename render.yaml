# Render blueprint: FastAPI backend + PostgreSQL, deployable in one click.
#
# Use it from https://dashboard.render.com/blueprints -> "New Blueprint
# Instance" and point it at this repository. Render reads this file, creates
# both resources and wires DATABASE_URL between them.
#
# Vercel cannot host this backend: its dependencies total ~521 MB (scipy,
# pandas, scikit-learn, statsmodels, lifelines) against a 250 MB serverless
# limit, so it runs as a container here instead.
#
# TWO FREE-TIER CAVEATS, both deliberate and documented rather than hidden:
#   1. A free web service sleeps after 15 minutes idle and takes ~50s to wake.
#      The first page load after a quiet period will be slow.
#   2. A free Postgres instance is REMOVED AFTER 30 DAYS. For anything you want
#      to keep, create a database on a provider with a durable free tier (Neon,
#      or Supabase if you have a project slot), and set DATABASE_URL to its
#      connection string instead. The app accepts a plain `postgres://` URL.

services:
  - type: web
    name: solana-lab-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Supplied automatically from the database declared below. Swap this for
      # a `sync: false` entry if you point at an external Postgres instead.
      - key: DATABASE_URL
        fromDatabase:
          name: solana-lab-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      # Set this to your Vercel URL after the frontend is deployed, e.g.
      # https://solana-launch-intelligence-lab.vercel.app
      # Left unsynced so the deploy prompts for it rather than shipping a guess.
      - key: CORS_ORIGINS
        sync: false
      # Apply Alembic migrations when the container starts. Correct for the
      # single instance a free plan runs; see docker-entrypoint.sh.
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
      # Conservative because the free data APIs throttle hard.
      - key: GECKOTERMINAL_RATE_LIMIT_PER_MIN
        value: "12"
      - key: DEXSCREENER_RATE_LIMIT_PER_MIN
        value: "30"
      # Off: the public Solana RPC rate-limits getTokenLargestAccounts.
      - key: ENABLE_HOLDER_COLLECTION
        value: "false"

databases:
  - name: solana-lab-db
    plan: free
    databaseName: solana_lab
    user: solana_lab
    region: oregon
