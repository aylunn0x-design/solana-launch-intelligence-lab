# Local deployment: Postgres + backend + frontend.
#
# Quick start:
#   cp .env.example .env
#   docker compose up --build
#   docker compose exec backend alembic upgrade head
#   docker compose exec backend python -m app.cli ingest --feed new --pages 10
#
# Nothing here contains a secret. POSTGRES_PASSWORD is read from .env and has no
# default, so the stack refuses to start rather than running on a guessable one.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-solana_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-solana_lab}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-solana_lab} -d ${POSTGRES_DB:-solana_lab}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-solana_lab}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-solana_lab}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      GECKOTERMINAL_RATE_LIMIT_PER_MIN: ${GECKOTERMINAL_RATE_LIMIT_PER_MIN:-25}
      DEXSCREENER_RATE_LIMIT_PER_MIN: ${DEXSCREENER_RATE_LIMIT_PER_MIN:-50}
      ENABLE_HOLDER_COLLECTION: ${ENABLE_HOLDER_COLLECTION:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  pgdata:
